<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OIIA CAT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 無骨なコントロールパネル -->
  <div id="ui-panel">
    <button id="mode-btn">MODE: HOLD</button>
    <button id="stop-btn" class="hidden">STOP</button>
  </div>

  <div id="cat-container">
    <img id="wait-cat" class="cat-media" src="wait-cat.png" alt="">
    
    <!-- 中央の回転する猫（デバイスに応じて最適なフォーマットを自動選択します） -->
    <video id="spin-cat" class="cat-media hidden" muted playsinline preload="auto" loop>
      <!-- ① iPhone / iOS / Mac (Safari) 用：HEVC with Alpha (.mov) -->
      <source src="oiia-cat.mov" type="video/mp4; codecs=hvc1">
      
      <!-- ② Windows / Android / その他ブラウザ用：WebM (.webm) -->
      <source src="oiia-cat.webm" type="video/webm">
    </video>
  </div>

  <script src="script.js"></script>
</body>
</html>
