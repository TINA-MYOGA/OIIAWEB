<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OIIA CAT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 無骨なコントロールパネル -->
  <div id="ui-panel">
    <button id="mode-btn">MODE: HOLD</button>
    <button id="stop-btn" class="hidden">STOP</button>
  </div>

  <div id="cat-container">
    <img id="wait-cat" class="cat-media" src="wait-cat.png" alt="">
    <video id="spin-cat" class="cat-media hidden" src="oiia-cat.webm" muted playsinline preload="auto"></video>
  </div>

  <script src="script.js"></script>
</body>
</html>
